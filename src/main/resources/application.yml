spring:
    application:
      name: event-ticket-engine

    datasource:
      url: jdbc:postgresql://localhost:5432/event_ticket_engine_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        "[hibernate.format_sql]": true

    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration

    data:
      redis:
        host: localhost
        port: 6379
        password: ""
        timeout: 2000ms

    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8081/realms/ticketing-realm
